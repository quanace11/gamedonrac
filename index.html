<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dòng Nước Xanh</title>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" hidden>
    <div id="crosshair"><i></i><div id="aim"></div></div>
    <div id="quests" class="card"></div>
    <div id="side">
      <div id="wallet" class="card"></div>
      <div id="site" class="card"></div>
      <div id="machines"></div>
    </div>
    <div id="interact"></div>
    <div id="hint" hidden></div>
    <div id="toolbar"></div>
    <div id="toasts"></div>
    <div id="buildbar" hidden>CHẾ ĐỘ ĐẶT MÁY · khung xanh: đặt máy · khung đỏ: tháo về kho · bấm B để thoát</div>
  </div>

  <div id="overlay" hidden></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
